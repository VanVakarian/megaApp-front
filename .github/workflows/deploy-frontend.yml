name: Deploy Angular frontend

on:
  push:
    branches:
      - develop
      - release

jobs:
  deploy-dev:
    name: Deploy to DEV
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (development)
        run: npm run build -- --configuration=development

      - name: Clean old dist on server (dev)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: rm -rf /var/www/megatest/*

      - name: Upload dist to dev server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: dist/*
          target: /var/www/megatest/
          strip_components: 1

  deploy-prod:
    name: Deploy to PROD
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    environment: front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npm run build -- --configuration=production

      - name: Clean old dist on server (prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: rm -rf /var/www/megaapp/*

      - name: Upload dist to prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: dist/browser/*
          target: /var/www/megaapp/
