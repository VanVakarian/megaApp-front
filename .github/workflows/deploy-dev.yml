name: Deploy to DEV

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      build-config: 'development'
      server-path: '/var/www/megatest'
    secrets:
      HOST: ${{ secrets.HOST }}
      USER: ${{ secrets.USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
