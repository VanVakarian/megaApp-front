<div class="flex items-stretch justify-center w-full gap-2 p-2">

  <div class="w-96 flex flex-col flex-shrink-0 gap-2">
    <v-card [config]="{
              padding: 2,
              borderRadius: 2,
            }">
      <div class="flex gap-2">
        <v-button [class.v-flat]="activeTab === MoneyTab.Currencies"
                  [class.v-link]="activeTab !== MoneyTab.Currencies"
                  [class.v-link-static]="activeTab !== MoneyTab.Currencies"
                  [config]="{
                    padding: 2,
                    isLabelHidden: true,
                  }"
                  (onClick)="setActiveTab(MoneyTab.Currencies)">
          <v-icon v-prefix
                  [name]="Icon.UniversalCurrency"
                  [size]="7"></v-icon>
        </v-button>

        <v-button [class.v-flat]="activeTab === MoneyTab.Categories"
                  [class.v-link]="activeTab !== MoneyTab.Categories"
                  [class.v-link-static]="activeTab !== MoneyTab.Categories"
                  [config]="{
                    padding: 2,
                    isLabelHidden: true,
                  }"
                  (onClick)="setActiveTab(MoneyTab.Categories)">
          <v-icon v-prefix
                  [name]="Icon.Category"
                  [size]="7"></v-icon>
        </v-button>

        <v-button [class.v-flat]="activeTab === MoneyTab.Accounts"
                  [class.v-link]="activeTab !== MoneyTab.Accounts"
                  [class.v-link-static]="activeTab !== MoneyTab.Accounts"
                  [config]="{
                    padding: 2,
                    isLabelHidden: true,
                  }"
                  (onClick)="setActiveTab(MoneyTab.Accounts)">
          <v-icon v-prefix
                  [name]="Icon.AccontBalanceWallet"
                  [size]="7"></v-icon>
        </v-button>

        <v-button class="grow"
                  [class.v-flat]="activeTab === MoneyTab.Transactions"
                  [class.v-link]="activeTab !== MoneyTab.Transactions"
                  [class.v-link-static]="activeTab !== MoneyTab.Transactions"
                  [config]="{
                    padding: 2,
                  }"
                  (onClick)="setActiveTab(MoneyTab.Transactions)">
          <v-icon v-prefix
                  [name]="Icon.List"
                  [size]="7"></v-icon>
          Transactions
        </v-button>
      </div>
    </v-card>

    @if (activeTab === MoneyTab.Currencies) {
      <currencies-list />
    }

    @if (activeTab === MoneyTab.Categories) {
      <categories-list />
    }

    @if (activeTab === MoneyTab.Accounts) {
      <accounts-list />
    }

    @if (activeTab === MoneyTab.Transactions) {
      <transactions-list />
    }
  </div>

  <div class="flex flex-wrap w-full gap-2">
    @for (item of [].constructor(4); track $index) {
      <v-card class="w-96 flex flex-shrink-0"
              [config]="{
                padding: 2,
                borderRadius: 2,
              }">
        Card {{ $index }}
      </v-card>
    }
  </div>

</div>
