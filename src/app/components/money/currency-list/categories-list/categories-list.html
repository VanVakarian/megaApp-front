<div class="max-w-4xl mx-auto">

  <div *ngIf="showForm"
       class="mb-8">
    <category-form [category]="editingCategory"
                   (saved)="onSaved()"
                   (cancelled)="onCancelled()">
    </category-form>
  </div>

  <div class="p-6 bg-white border border-gray-200 rounded-lg">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold">Categories List</h3>
      <button *ngIf="!showForm"
              (click)="showCreateForm()"
              class="hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 px-4 py-2 text-white bg-blue-600 rounded-md">
        Add New Category
      </button>
    </div>

    <div *ngIf="categories.length === 0"
         class="py-8 text-center text-gray-500">
      No categories found.
    </div>

    <div *ngFor="let category of categories"
         class="last:border-b-0 py-4 border-b border-gray-100">
      <div class="flex items-start justify-between">
        <div class="flex-1">
          <div class="mb-2">
            <span class="font-semibold text-gray-900">{{ category.name }}</span>
            <span class="ml-2 text-gray-600">({{ getUsedForDisplayName(category.usedFor) }})</span>
          </div>
          <div class="flex gap-2">
            <span *ngIf="category.groupKey"
                  class="px-2 py-1 text-xs text-gray-700 bg-gray-200 rounded">
              Group: {{ category.groupKey }}
            </span>
          </div>
        </div>
        <div class="flex gap-2 ml-4">
          <button (click)="editCategory(category)"
                  class="hover:bg-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 px-3 py-1 text-sm text-blue-700 bg-blue-100 rounded">
            Edit
          </button>
          <button (click)="deleteCategory(category.id!)"
                  class="hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-red-500 px-3 py-1 text-sm text-red-700 bg-red-100 rounded">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
