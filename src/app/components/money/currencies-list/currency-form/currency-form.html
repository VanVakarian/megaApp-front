<v-card [config]="{
          padding: 4,
          borderRadius: 2,
        }">
  <div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Currency' : 'Add New Currency' }}</div>

  <div class="flex flex-col gap-4">
    <v-input [config]="{
               label: 'Title',
               placeholder: 'US Dollar',
               type: 'text',
             }"
             [(ngModel)]="title" />

    <v-input [config]="{
               label: 'Ticker',
               placeholder: 'USD',
               type: 'text',
             }"
             [(ngModel)]="ticker" />

    <v-input [config]="{
               label: 'Symbol',
               placeholder: '$',
               type: 'text',
             }"
             [(ngModel)]="symbol" />

    <v-dropdown [label]="'Symbol Position'"
                [placeholder]="'Select position'"
                [items]="symbolPositionItems()"
                [(ngModel)]="symbolPosEnum"></v-dropdown>

    <v-checkbox [value]="whitespace"
                (valueChange)="whitespace = $event">
      Whitespace between symbol and amount
    </v-checkbox>

    <div class="flex gap-2">
      <v-button class="v-flat"
                [config]="{
                  isDisabled: !title || !ticker || !symbol,
                }"
                (onClick)="save()">
        {{ isEditing() ? 'Update' : 'Create' }}
      </v-button>

      <v-button class="v-flat"
                (onClick)="cancel()">
        Cancel
      </v-button>
    </div>
  </div>
</v-card>
