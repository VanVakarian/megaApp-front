<div class="flex flex-col gap-3">
  <div class="flex items-center justify-between">
    <div class="text-sm font-semibold">Account Balance</div>
    <v-toggle [items]="viewToggleItems"
              [value]="viewToggleValue()"
              (valueChange)="onViewToggleChange($event)"></v-toggle>
  </div>

  <div class="h-[220px]">
    <canvas #chartCanvas></canvas>
  </div>

  <div class="flex flex-col gap-2 pt-1">
    <div class="gap-x-3 gap-y-1 flex flex-wrap items-center">
      <v-toggle [items]="suspensionToggleItems"
                [value]="suspensionToggleValue()"
                [config]="{ fitContent: true }"
                (valueChange)="onSuspensionToggleChange($event)"></v-toggle>
      <v-button class="v-flat"
                [config]="{
                  padding: 1,
                }"
                (onClick)="toggleAll()">
        {{ allNoneLabel$$() }}
      </v-button>
    </div>
    <div class="gap-x-4 gap-y-1 flex flex-wrap">
      @for (series of dataInput().accountSeries; track series.accountId) {
        <v-checkbox [value]="isAccountEnabled(series.accountId)"
                    [config]="{
                      size: 4,
                      checkIconSize: 3,
                      gap: 1,
                    }"
                    (onChanged)="toggleAccount(series.accountId, $event)">
          <span class="inline-flex items-center gap-1 text-xs">
            <span class="inline-block w-2.5 h-2.5 rounded-sm flex-shrink-0"
                  [style.background]="getAccountColor(series.accountId)"></span>
            {{ series.accountTitle }}
          </span>
        </v-checkbox>
      }
    </div>
  </div>
</div>
