<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Organization' : 'Add New Organization' }}</div>

<div class="flex flex-col gap-4">
  <v-input [config]="{
               label: 'Title',
               placeholder: 'Sberbank',
               type: 'text',
             }"
           [ngModel]="title$$()"
           (ngModelChange)="title$$.set($event)" />

  <div class="flex flex-col gap-2">
    <div class="text-sm opacity-70">Logo</div>

    <div class="flex items-center gap-3">
      @if (getLogoSrc(); as src) {
        <img [src]="src"
             class="w-10 h-10 rounded object-contain border border-[color:var(--v-outline-color)]"
             alt="">

        <v-button class="v-flat"
                  [config]="{
                    paddingY: 1,
                    paddingX: 2,
                  }"
                  (onClick)="clearLogo()">
          Remove
        </v-button>

        <v-button class="v-flat"
                  [config]="{
                    paddingY: 1,
                    paddingX: 2,
                  }"
                  (onClick)="triggerFileInput()">
          Replace
        </v-button>
      } @else {
        <div class="w-10 h-10 rounded border border-dashed border-[color:var(--v-outline-color)] opacity-40"></div>

        <v-button class="v-flat"
                  [config]="{
                    paddingY: 1,
                    paddingX: 2,
                  }"
                  (onClick)="triggerFileInput()">
          Upload image
        </v-button>
      }

      <input #fileInput
             type="file"
             accept="image/*"
             class="sr-only"
             (change)="onFileSelected($event)">
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [config]="{
                  isDisabled: !isFormValid(),
                }"
              (onClick)="save()">
      {{ isEditing() ? 'Update' : 'Create' }}
    </v-button>

    <v-button class="v-flat"
              (onClick)="cancel()">
      Cancel
    </v-button>
  </div>
</div>
