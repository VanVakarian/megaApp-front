<v-card [config]="{
          padding: 4,
          borderRadius: 2,
        }">
  <div class="mb-4 text-lg font-semibold">
    {{ isEditing() ? 'Edit Transaction' : 'Add Transaction' }}
    <v-icon class="hidden"
            [name]="Icon.CalendarMonth"
            [size]="0"></v-icon>
  </div>

  <div class="flex flex-col gap-4">
    <v-dropdown [label]="'Account'"
                [placeholder]="'Select an account'"
                [items]="accountItems()"
                [isRequired]="true"
                [ngModel]="accountId$$()"
                (ngModelChange)="accountId$$.set($event)"></v-dropdown>

    <v-dropdown [label]="'Type'"
                [placeholder]="'Select type'"
                [items]="kindItems()"
                [isRequired]="true"
                [ngModel]="kind$$()"
                (ngModelChange)="kind$$.set($event); onKindChange()"></v-dropdown>

    <v-dropdown [label]="'Category (optional)'"
                [placeholder]="'No category'"
                [items]="categoryItems()"
                [ngModel]="categoryId$$()"
                (ngModelChange)="categoryId$$.set($event)"></v-dropdown>

    <div class="flex gap-4">
      <v-input [config]="{
                 label: 'Date',
                 placeholder: 'YYYY-MM-DD',
                 type: 'text',
                 inputmode: 'numeric',
               }"
               [ngModel]="dateISO$$()"
               (ngModelChange)="dateISO$$.set($event)">
        <v-button class="calendar-v-button v-link v-link-static mr-2"
                  v-postfix
                  tabindex="-1"
                  [config]="{
                    padding: 1,
                  }"
                  (mousedown)="$event.preventDefault()"
                  (onClick)="onDateControlClick()">
          <v-icon v-prefix
                  [name]="Icon.CalendarMonth"
                  [size]="6"></v-icon>
          <span class="relative">
            <input #dateInputElem
                   id="dateInputElem"
                   type="date"
                   class="absolute w-0 h-0 p-0 m-0 border-0 opacity-0 top-[14px] right-[29px]"
                   [value]="dateISO$$()"
                   (change)="onDatePicked($event)" />
          </span>
        </v-button>
      </v-input>

      <v-input class="amount-input"
               [config]="{
                 label: 'Amount',
                 placeholder: '0.00',
                 type: 'text',
                 inputmode: 'decimal',
                 textAlign: 'right',
               }"
               [ngModel]="amount$$()"
               (ngModelChange)="amount$$.set($event)">
        @if (getCurrencyPrefix(); as currencyPrefix) {
          <ng-container v-prefix>
            <span class="mx-2">{{ currencyPrefix }}</span>
          </ng-container>
        }
        @if (getCurrencyPostfix(); as currencyPostfix) {
          <ng-container v-postfix>
            <span class="mx-2">{{ currencyPostfix }}</span>
          </ng-container>
        }
      </v-input>
    </div>

    <v-input [config]="{
               label: 'Notes (optional)',
               placeholder: 'Add any notes about this transaction...',
               isTextarea: true,
               rows: 2,
             }"
             [ngModel]="notes$$()"
             (ngModelChange)="notes$$.set($event)" />

    <div class="flex gap-2">
      <v-button class="v-flat"
                [config]="{
                  isDisabled: !isFormValid(),
                }"
                (onClick)="save()">
        {{ isEditing() ? 'Update' : 'Add' }}
      </v-button>

      <v-button class="v-flat"
                (onClick)="cancel()">
        Cancel
      </v-button>
    </div>
  </div>
</v-card>
