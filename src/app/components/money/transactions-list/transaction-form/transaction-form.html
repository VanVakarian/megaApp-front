<v-card [config]="{
          padding: 4,
          borderRadius: 2,
        }">
  <div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Transaction' : 'Add New Transaction' }}</div>

  <div class="flex flex-col gap-4">
    <v-input [config]="{
               label: 'Date',
               placeholder: 'YYYY-MM-DD',
               type: 'text',
               inputmode: 'numeric',
             }"
             [(ngModel)]="dateISO" />

    <v-dropdown [label]="'Account'"
                [placeholder]="'Select an account'"
                [items]="accountItems()"
                [isRequired]="true"
                [(ngModel)]="accountId"></v-dropdown>

    <div>
      <v-input [config]="{
                 label: 'Amount',
                 placeholder: '0.00',
                 type: 'number',
                 inputmode: 'decimal',
                 textAlign: 'right',
               }"
               [(ngModel)]="amount" />

      <div class="opacity-70 mt-1 text-xs">
        Enter positive amount - it will be automatically
        <span [class]="kind === 'expense' ? 'text-red-600' : 'text-green-600'">
          {{ kind === 'expense' ? 'subtracted' : 'added' }}
        </span>
        based on transaction type
      </div>
    </div>

    <v-dropdown [label]="'Type'"
                [placeholder]="'Select type'"
                [items]="kindItems()"
                [isRequired]="true"
                [(ngModel)]="kind"
                (ngModelChange)="onKindChange()"></v-dropdown>

    <v-checkbox [value]="isGift"
                (valueChange)="isGift = $event">
      This is a gift
    </v-checkbox>

    <v-input [config]="{
               label: 'Notes (optional)',
               placeholder: 'Add any notes about this transaction...',
               isTextarea: true,
               rows: 3,
             }"
             [(ngModel)]="notes" />

    <v-dropdown [label]="'Category (optional)'"
                [placeholder]="'No category'"
                [items]="categoryItems()"
                [(ngModel)]="categoryId"></v-dropdown>

    <div class="flex gap-2">
      <v-button class="v-flat"
                [config]="{
                  isDisabled: !isFormValid(),
                }"
                (onClick)="save()">
        {{ isEditing() ? 'Update' : 'Create' }}
      </v-button>

      <v-button class="v-flat"
                (onClick)="cancel()">
        Cancel
      </v-button>
    </div>
  </div>
</v-card>
