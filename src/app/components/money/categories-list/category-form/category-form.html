<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Category' : 'Add New Category' }}</div>

<div class="flex flex-col gap-4">
  <v-input label="Name"
           placeholder="Food & Restaurants"
           [ngModel]="name$$()"
           (ngModelChange)="name$$.set($event)" />

  <div class="flex gap-4">
    <v-dropdown class="flex-1"
                [label]="'Type'"
                [placeholder]="'Select type'"
                [items]="categoryTypeItems()"
                [isRequired]="true"
                [isDisabled]="isTypeLocked$$()"
                [ngModel]="categoryType$$()"
                (ngModelChange)="categoryType$$.set($event); onCategoryTypeChange()"></v-dropdown>

    <v-dropdown class="flex-1"
                [label]="'Parent category (optional)'"
                [placeholder]="'No parent'"
                [items]="parentCategoryItems()"
                [ngModel]="parentId$$()"
                (ngModelChange)="parentId$$.set($event)"></v-dropdown>
  </div>

  <v-checkbox [value]="hiddenOnCharts$$()"
              [size]="5"
              [gap]="2"
              [checkIconSize]="4"
              (onChanged)="hiddenOnCharts$$.set($event)">
    <span class="text-sm">Hide on charts</span>
  </v-checkbox>

  <div class="flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <span class="text-sm text-gray-400">Chart color</span>
      <div class="flex items-center gap-2">
        @if (hueSwatchColor$$(); as swatchColor) {
          <span class="inline-block w-4 h-4 rounded-sm"
                [style.background]="swatchColor"></span>
        }
        <v-button surface="flat"
                  [class.v-primary]="hue$$() === null"
                  [padding]="1"
                  (onClick)="hue$$.set(null)">Auto</v-button>
      </div>
    </div>
    <v-slider [min]="0"
              [max]="360"
              [value]="hue$$() ?? 0"
              [trackColor]="hueTrackGradient$$()"
              fillColor="transparent"
              [style.opacity]="hue$$() === null ? 0.5 : 1"
              (valueChange)="onHueChange($event)" />
  </div>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [isDisabled]="!name$$() || !categoryType$$()"
              (onClick)="save()">
      {{ isEditing() ? 'Update' : 'Create' }}
    </v-button>

    <v-button surface="flat"
              (onClick)="cancel()">
      Cancel
    </v-button>
  </div>
</div>
