<div class="bg-gray-50 p-6 rounded-lg">
  <h3 class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit Account' : 'Add New Account' }}</h3>

  <div class="space-y-4">
    <div>
      <label class="block mb-1 text-sm font-medium text-gray-700">Title <span class="text-red-500">*</span>:</label>
      <input type="text"
             placeholder="My Bank Account"
             class="focus:outline-none focus:ring-2 focus:ring-blue-500 w-full px-3 py-2 border border-gray-300 rounded-md"
             [(ngModel)]="title">
    </div>

    <div>
      <label class="block mb-1 text-sm font-medium text-gray-700">Currency <span class="text-red-500">*</span>:</label>
      <select [(ngModel)]="currencyId"
              class="focus:outline-none focus:ring-2 focus:ring-blue-500 w-full px-3 py-2 border border-gray-300 rounded-md">
        @for (currency of currencies(); track currency.id) {
          <option [value]="currency.id">{{ currency.title }} ({{ currency.ticker }})</option>
          }
      </select>
    </div>

    <div>
      <label class="block mb-1 text-sm font-medium text-gray-700">Account Type <span
              class="text-red-500">*</span>:</label>
      <select class="focus:outline-none focus:ring-2 focus:ring-blue-500 w-full px-3 py-2 border border-gray-300 rounded-md"
              [(ngModel)]="kind">
        @for (kindOption of getKindValues(); track kindOption) {
          <option [value]="kindOption">{{ getKindDisplayName(kindOption) }}</option>
        }
      </select>
    </div>

    <div class="flex items-center">
      <input type="checkbox"
             class="focus:ring-blue-500 w-4 h-4 mr-2 text-blue-600 border-gray-300 rounded"
             [(ngModel)]="invest">
      <label class="text-sm font-medium text-gray-700">
        Investment account
      </label>
    </div>

    <div class="flex gap-2">
      <button type="button"
              class="hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed px-4 py-2 text-white bg-blue-600 rounded-md"
              [disabled]="!isFormValid()"
              (click)="save()">
        {{ isEditing() ? 'Update' : 'Create' }}
      </button>

      <button type="button"
              class="hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 px-4 py-2 text-white bg-gray-600 rounded-md"
              (click)="cancel()">
        Cancel
      </button>
    </div>
  </div>
</div>
