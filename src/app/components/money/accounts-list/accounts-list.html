<div>

  <v-card [config]="{
            padding: 4,
            borderRadius: 2,
          }">
    <div class="flex items-center justify-between mb-4">
      <div class="text-lg font-semibold">Accounts</div>
      <v-button class="v-flat"
                [config]="{
                  paddingY: 1,
                }"
                (onClick)="showCreateForm()">
        <v-icon v-prefix
                [name]="Icon.Add"
                [size]="6"></v-icon>
        New Account
      </v-button>
    </div>

    @if (accounts$$().length === 0) {
      <div class="opacity-70 py-8 text-center">
        No accounts found.
      </div>
    }

    @for (account of accounts$$(); track account.id) {
      <div class="last:border-b-0 py-4 border-b border-[color:var(--v-outline-color)]">
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1">
            <div class="mb-2">
              <span class="font-semibold">{{ account.title }}</span>
              <span class="opacity-70 ml-2">{{ getCurrencySymbol(account.currencyId) }}</span>
            </div>

            <div class="opacity-70 flex gap-3 text-xs">
              @if (account.isInvest) {
                <span>Investment</span>
              }

              <span>{{ getKindDisplayName(account.kind) }}</span>
            </div>
          </div>

          <div class="flex gap-2">
            <v-button class="v-flat"
                      [config]="{
                        isLabelHidden: true,
                        padding: iconButton.padding,
                      }"
                      (onClick)="editAccount(account)">
              <v-icon v-prefix
                      [name]="Icon.Edit"
                      [size]="iconButton.size"></v-icon>
            </v-button>

            <v-button class="v-danger"
                      [config]="{
                        isLabelHidden: true,
                        padding: iconButton.padding,
                        isDisabled: !canDeleteAccount(account.id!),
                      }"
                      (onClick)="deleteAccount(account.id!)">
              <v-icon v-prefix
                      [name]="Icon.Delete"
                      [size]="iconButton.size"></v-icon>
            </v-button>
          </div>
        </div>
      </div>
    }

  </v-card>
</div>

<form-modal [isModalOpen]="showForm$$()"
            (closeOutput)="onCancelled()">
  <account-form [accountInput]="editingAccount$$()"
                [currenciesInput]="currencies$$()"
                [organizationsInput]="organizations$$()"
                (savedOutput)="onSaved()"
                (cancelledOutput)="onCancelled()" />
</form-modal>

<default-modal [isModalOpen]="isDeleteConfirmOpen$$()"
               [modalTitle]="'Are you sure you want to delete this account?'"
               [confirmButtonLabel]="'Yes'"
               [cancelButtonLabel]="'No'"
               (confirmOutput)="onDeleteConfirmed()"
               (cancelOutput)="closeConfirmationModal()"
               (closeOutput)="closeConfirmationModal()" />
