<div class="col col-01">
  <v-card>
    Карточка по умолчанию (borderRadius=2, padding=2)
    <div class="buttons-row">
      <v-button flat>
        Кнопка
      </v-button>

      <v-button raised>
        Кнопка
      </v-button>

      <v-button primary>
        Кнопка
      </v-button>
    </div>
  </v-card>

  <v-card [borderRadius]="1"
          [padding]="1">
    Компактная карточка (маленькие значения)
  </v-card>

  <v-card [borderRadius]="0">
    Карточка без скругления
    <v-input #testInput>
      <span v-prefix
            class="prefix">$</span>
      <button v-postfix
              type="button"
              class="postfix">🔍</button>
    </v-input>
  </v-card>

  <v-input label="Имя пользователя"
           placeholder="Введите ваше имя" />

  <v-input label="Email"
           placeholder="example@email.com"
           [type]="InputType.Email" />

  <v-input label="Пароль"
           placeholder="Введите пароль"
           [type]="InputType.Password" />

  <v-input label="Отключенное поле"
           placeholder="Это поле отключено"
           [isDisabled]="true" />

  <v-input label="Поле с ошибкой"
           placeholder="Введите что-то"
           errorMessage="Это поле обязательно для заполнения" />
</div>
