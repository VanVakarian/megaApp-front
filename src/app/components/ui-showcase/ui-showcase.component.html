<div class="col col-01">
  <v-card>Карточка по умолчанию (borderRadius=2, padding=2)</v-card>

  <v-card [borderRadius]="1"
          [padding]="1">
    Компактная карточка (маленькие значения)
  </v-card>

  <v-card [borderRadius]="0">
    Карточка без скругления
    <v-input #testInput>
      <span v-prefix
            class="prefix">$</span>
      <button v-postfix
              type="button"
              class="postfix">🔍</button>
    </v-input>
  </v-card>

  <v-input label="Имя пользователя"
           placeholder="Введите ваше имя" />

  <v-input label="Email"
           type="email"
           placeholder="example@email.com" />

  <v-input label="Пароль"
           type="password"
           placeholder="Введите пароль" />

  <v-input label="Отключенное поле"
           placeholder="Это поле отключено"
           [disabled]="true" />

  <v-input label="Поле с ошибкой"
           placeholder="Введите что-то"
           errorMessage="Это поле обязательно для заполнения" />
</div>
