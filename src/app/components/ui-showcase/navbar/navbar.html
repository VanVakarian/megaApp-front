<nav class="flex flex-col gap-2 h-screen pt-4 pb-4 pl-2">
        <!-- <div class="sidebar-header">
    <h3>UI Kit</h3>
  </div> -->

        <div class="flex flex-col gap-2">
                <v-button [buttonStyle]="foodButtonStyle()"
                          [width]="'100%'"
                          [paddingX]="2"
                          [isLabelHidden]="isMenuCollapsed"
                          class="menu-item"
                          (click)="navigateToFood()">
                        <v-icon v-prefix
                                [name]="Icon.Restaurant" />
                        Food
                </v-button>

                <v-button [buttonStyle]="moneyButtonStyle()"
                          [width]="'100%'"
                          [paddingX]="2"
                          [isLabelHidden]="isMenuCollapsed"
                          class="menu-item"
                          (click)="navigateToMoney()">
                        <v-icon v-prefix
                                [name]="Icon.Paid" />
                        Money
                </v-button>

                <v-button [buttonStyle]="iconsButtonStyle()"
                          [width]="'100%'"
                          [paddingX]="2"
                          [isLabelHidden]="isMenuCollapsed"
                          class="menu-item"
                          (click)="navigateToIcons()">
                        <v-icon v-prefix
                                [name]="Icon.ViewCozy" />
                        Icons
                </v-button>

                <v-button [buttonStyle]="otherButtonStyle()"
                          [width]="'100%'"
                          [paddingX]="2"
                          [isLabelHidden]="isMenuCollapsed"
                          class="menu-item"
                          (click)="navigateToOther()">
                        <v-icon v-prefix
                                [name]="Icon.Article" />
                        Other
                </v-button>
        </div>

        <div class="flex flex-col gap-2 mt-auto">
                <v-button [buttonStyle]="ButtonStyle.Flat"
                          [paddingX]="2"
                          [isLabelHidden]="true"
                          class="menu-item"
                          (click)="toggleMenuCollapse()">
                        <v-icon v-prefix
                                [name]="getMenuSizeControlIconName()" />
                </v-button>

                <v-button [buttonStyle]="settingsButtonStyle()"
                          [width]="'100%'"
                          [paddingX]="2"
                          [isLabelHidden]="isMenuCollapsed"
                          class="menu-item"
                          (click)="navigateToSettings()">
                        <v-icon v-prefix
                                [name]="Icon.Settings" />
                        Settings
                </v-button>
        </div>
</nav>
