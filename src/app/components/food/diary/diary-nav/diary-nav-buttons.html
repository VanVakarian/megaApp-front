<div class="flex w-full gap-2">
  <div class="grow whitespace-nowrap overflow-hidden text-xl text-center">
    {{ selectedDateFormatted$$() }}
  </div>

  <div class="flex flex-col">
    <v-button primary
              [config]="{
              isWithoutShadow: true,
              isLabelHidden: true,
              padding: 2,
            }"
              (click)="onDateControlClick()">
      <v-icon v-prefix
              [name]="primaryActionIcon$$()"
              [size]="5" />
    </v-button>

    <mat-form-field class="w-0 h-0">
      <input matInput
             [matDatepicker]="picker"
             [formControl]="formCalendarSelectedDay"
             [max]="initDateTodayWithUserHourShift"
             (dateChange)="onDatePicked($event)" />
      <mat-datepicker-toggle [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>
  </div>

  <v-button primary
            [config]="{
              isWithoutShadow: true,
              isLabelHidden: true,
              padding: 1,
            }"
            (click)="goToPreviousDay()">
    <v-icon v-prefix
            [name]="Icon.KeyboardArrowLeft"
            [size]="7" />
  </v-button>

  <v-button primary
            [config]="{
              isWithoutShadow: true,
              isLabelHidden: true,
              padding: 1,
            }"
            (click)="goToNextDay()">
    <v-icon v-prefix
            [name]="Icon.KeyboardArrowRight"
            [size]="7" />
  </v-button>
</div>
