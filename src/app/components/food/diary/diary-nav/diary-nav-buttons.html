<div class="flex w-full gap-2">
  @if(deviceInfoService.isDesktopScreen$$()) {
    <v-button primary
              [config]="{
                isWithoutShadow: true,
                isLabelHidden: true,
                padding: 1,
              }"
              (click)="goToPreviousDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowLeft"
              [size]="7" />
    </v-button>
  }

  <div class="grow whitespace-nowrap overflow-hidden text-xl text-center">
    {{ selectedDateFormatted$$() }}
  </div>

  @if(deviceInfoService.isDesktopScreen$$()) {
    <div class="flex flex-col">
      <v-button primary
                [config]="{
                isWithoutShadow: true,
                isLabelHidden: true,
                padding: 2,
              }"
                (click)="pickerDesktop.open()">
        <v-icon v-prefix
                [name]="Icon.CalendarMonth"
                [size]="5" />
      </v-button>

      <mat-form-field class="w-0 h-0">
        <input matInput
               [matDatepicker]="pickerDesktop"
               [formControl]="formCalendarSelectedDay"
               [max]="initDateTodayWithUserHourShift"
               (dateChange)="onDatePicked($event)" />
        <mat-datepicker-toggle [for]="pickerDesktop" />
        <mat-datepicker #pickerDesktop />
      </mat-form-field>
    </div>

    <v-button primary
              [config]="{
                isWithoutShadow: true,
                isLabelHidden: true,
                padding: 1,
              }"
              (click)="goToNextDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowRight"
              [size]="7" />
    </v-button>
  }
</div>

@if (authService.isAuthenticated$$()) {
  <div class="lg:hidden fixed bottom-0 left-0 flex justify-between w-full gap-5 px-4 pb-4"
       style="z-index: 10">
    <v-button primary
              [config]="{
                borderRadius: 7,
                isWithoutShadow: true,
                isLabelHidden: true,
                padding: 2,
              }"
              (click)="goToPreviousDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowLeft"
              [size]="10" />
    </v-button>

    <v-button primary
              [config]="{
                borderRadius: 7,
                isWithoutShadow: true,
                isLabelHidden: true,
                padding: 3,
              }"
              (click)="pickerTouch.open()">
      <v-icon v-prefix
              [name]="Icon.CalendarMonth"
              [size]="8" />
    </v-button>

    <v-button primary
              [config]="{
                borderRadius: 7,
                isWithoutShadow: true,
                isLabelHidden: true,
                padding: 2,
              }"
              (click)="goToNextDay()">
      <v-icon v-prefix
              [name]="Icon.KeyboardArrowRight"
              [size]="10" />
    </v-button>

    <div class="w-14 h-14">
      <!-- placeholder for hamburger menu -->
    </div>
  </div>
}

<mat-form-field class="hide-form">
  <input matInput
         [matDatepicker]="pickerTouch"
         [formControl]="formCalendarSelectedDay"
         [max]="initDateTodayWithUserHourShift"
         (dateChange)="onDatePicked($event)" />
  <mat-datepicker-toggle [for]="pickerTouch" />
  <mat-datepicker #pickerTouch
                  touchUi />
</mat-form-field>
