<form [formGroup]="diaryEntryForm"
      (ngSubmit)="submitForm()">
  <div class="flex flex-col gap-4 p-4">
    <div class=" flex items-center justify-center">
      <div class="flex-grow text-xl font-medium text-center">
        {{ selectedProduct$$()?.name }}
      </div>

      <v-button raised
                class="self-start"
                [config]="{
                  isLabelHidden: true,
                  padding: 2,
                }"
                (click)="editProduct()">
        <v-icon v-prefix
                [name]="Icon.Edit"
                [size]="7" />
      </v-button>
    </div>

    <div class="flex items-end justify-end gap-4">
      <div class="flex gap-2 mb-2 text-xl">
        <ui-progress-icon circleStyle
                          class="mb-[3.7px] w-1/3 text-right place-content-end"
                          [progressNum]="projectedSelectedDaysEatenPercentNum"
                          [diameter]="24" />

        <span class="w-2/3 font-bold text-left"> {{ projectedSelectedDaysEatenPercentPadded }}% </span>
      </div>

      <div class="w-36">
        <div class="relative">
          <v-input [formControl]="foodWeightControl"
                   [config]="{
                     type: 'number',
                     label: 'Вес',
                     fontSize: '20px',
                     fontWeight: 500,
                     textAlign: 'right'
                   }"
                   (onInputChanged)="onFoodWeightInput()">
            <span v-postfix
                  class="ml-1 mr-3">г.</span>
          </v-input>
        </div>
      </div>
    </div>

    <div class="flex justify-between">
      <v-button primary
                [config]="{
                  isLabelHidden: true,
                  padding: 1,
                }"
                (click)="goBack()">
        <v-icon v-prefix
                [name]="Icon.ChevronLeft"
                [size]="9" />
      </v-button>

      <v-button [config]="{
                  type: 'submit',
                  isDisabled: !isFormValid(),
                }">
        Добавить
      </v-button>
    </div>
  </div>
</form>
