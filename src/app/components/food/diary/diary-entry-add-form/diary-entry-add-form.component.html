<form [formGroup]="diaryEntryForm"
      (ngSubmit)="submitForm()">
  <div class="flex flex-col gap-4 p-4">
    <div class="text-xl text-center">
      {{ selectedProduct().name }}
    </div>

    <div class="flex gap-4">
      <div class="h-14 w-1/2 p-4 bg-gray-100 rounded-lg">
        <div class="whitespace-nowrap inline-flex items-center justify-center gap-2 text-xl text-center">
          <ui-progress-icon circleStyle
                            [progressNum]="projectedSelectedDaysEatenPercentNum"
                            [diameter]="24"
                            class="mb-[3.7px] w-1/3 text-right place-content-end" />

          <span class="w-2/3 font-bold text-left"> {{ projectedSelectedDaysEatenPercentPadded }}% </span>
        </div>
      </div>

      <div class="w-1/2">
        <div class="relative">
          <input type="number"
                 [formControl]="foodWeightControl"
                 class="focus:border-blue-500 focus:outline-none w-full px-3 py-2 text-right border border-gray-300 rounded-md"
                 placeholder="0"
                 (input)="onFoodWeightInput()" />
          <span class="right-3 top-2 absolute text-gray-500">г.</span>
        </div>

        @if (foodWeightControl.value !== null && (foodWeightControl.errors?.['required'] || foodWeightControl.errors?.['pattern'])) {
          <div class="mt-1 text-sm text-red-500">
            Положительное целое число
          </div>
        }
      </div>
    </div>

    <div class="flex justify-between">
      <v-button primary
                [isLabelHidden]="true"
                [paddingX]="0"
                [paddingY]="0"
                (click)="goBack()">
        <v-icon v-prefix
                [name]="IconName.ChevronLeft"
                [size]="10" />
      </v-button>

      <button type="submit"
              class="disabled:bg-gray-300 px-4 py-2 text-white bg-blue-500 rounded-md"
              [disabled]="!isFormValid()">
        Добавить
      </button>
    </div>
  </div>
</form>
