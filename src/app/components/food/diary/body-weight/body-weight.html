<div class="flex flex-col gap-4">
  <div class="flex justify-end">
    <v-input fieldStateAnimations
             class="w-1/3"
             [state]="currentState"
             [formControl]="form.controls.bodyWeight"
             [config]="{
               type: 'number',
               label: FormLabels.WEIGHT,
               fontSize: '20px',
               fontWeight: 500,
               textAlign: 'right',
             }"
             (onInputChanged)="onInput()"
             (onEnterPressed)="onEnter()">
      <span v-postfix
            class="ml-1 mr-3">кг</span>
    </v-input>
  </div>
</div>
