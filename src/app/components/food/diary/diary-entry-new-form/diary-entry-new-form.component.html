<div class="lg:hidden bg-slate-950/80 fixed top-0 left-0 z-20 w-full">
  <div class="h-dvh p-2"
       [class.hidden]="!isModalOpened">
    <div class="rounded-[4px] p-2 bg-white">
      <app-food-select-dropdown #mobileFoodSelect
                                [parentForm]="diaryEntryForm"
                                [foodNameControl]="foodNameControl"
                                (onFoodSelected)="onFoodSelected($event)" />
    </div>

    <div class="h-full"
         (click)="isModalOpened = false"></div>
  </div>
</div>

<form #formGroupDirective="ngForm"
      [formGroup]="diaryEntryForm"
      (submit)="onSubmit()">

  @if (isMobile) {
    <mat-form-field appearance="outline"
                    class="w-full">
      <mat-label>Еда:</mat-label>

      <input type="text"
             matInput
             required
             [formControl]="foodNameControl"
             (click)="openModal()" />
    </mat-form-field>
  } @else {
    <app-food-select-dropdown #desktopFoodSelect
                              [parentForm]="diaryEntryForm"
                              [foodNameControl]="foodNameControl"
                              (onFoodSelected)="onFoodSelected($event)" />
  }

  <div class="flex gap-4">
    <mat-card class="h-14 w-1/2 p-4">
      <div class="whitespace-nowrap inline-flex items-center justify-center gap-2 text-xl text-center">
        <ui-progress-icon circleStyle
                          [progressNum]="projectedSelectedDaysEatenPercentNum"
                          [diameter]="24"
                          class="mb-[3.7px] w-1/3 text-right place-content-end" />

        <span class="w-2/3 font-bold text-left"> {{ projectedSelectedDaysEatenPercentPadded }}% </span>
      </div>
    </mat-card>

    <mat-form-field appearance="outline"
                    class="w-1/2">
      <mat-label>Вес в граммах:</mat-label>

      <input #weightInputElem
             type="number"
             [formControl]="foodWeightControl"
             matInput
             class="text-right"
             (input)="onFoodWeightInput()" />

      <span matSuffix
            class="mx-2">г.</span>

      @if (foodWeightControl.value !== null && (foodWeightControl.errors?.['required'] || foodWeightControl.errors?.['pattern'])) {
        <mat-error>
          Положительное целое число
        </mat-error>
      }
    </mat-form-field>
  </div>

  <div class="flex flex-row-reverse w-full">
    <button type="submit"
            color="primary"
            [disabled]="!isFormValid()"
            mat-raised-button
            class="mat-button-enlarged-45-px text-lg">
      Добавить
    </button>
  </div>

</form>
