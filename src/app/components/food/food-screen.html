@if (totalColumnCount$$() === 1) {
  @if (foodScreenModeService.mobileTab$$() === Tab.Diary) {
    <food-diary class="px-1" />
  } @else {
    <food-stats-accordion class="px-1" />
  }
} @else {
  <food-diary class="min-w-0 px-1" />
  <food-stats-columns class="min-w-0 px-1"
                       [style.grid-column]="'2 / -1'"
                       [columnCountInput]="statsColumnCount$$()" />
}

<food-mode-toggle-fab />
