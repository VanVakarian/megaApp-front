@if (totalColumnCount$$() === 1) {
  @if (foodScreenModeService.mobileTab$$() === Tab.Diary) {
    <food-diary />
  } @else {
    <food-stats-accordion />
  }
} @else {
  <food-diary class="min-w-0"
              style="grid-row: 1"
              [style.grid-column]="diaryColumnIndex$$()" />
  <food-stats-columns [columnCountInput]="statsColumnCount$$()"
                       [gridColumnsInput]="statsGridColumns$$()" />
}

<food-mode-toggle-fab />
