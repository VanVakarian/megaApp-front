@for (column of columns$$(); track $index) {
  <div class="flex min-w-0 flex-1 flex-col gap-3">
    @for (block of column; track block) {
      @switch (block) {
        @case (Block.Ribbon) {
          <food-stats-heatmap-strip />
        }
        @case (Block.Streak) {
          <food-stats-streak />
        }
        @case (Block.TopProducts) {
          <food-stats-top-products />
        }
        @case (Block.Milestones) {
          <food-stats-milestones />
        }
        @case (Block.Charts) {
          <food-stats-charts />
        }
      }
    }
  </div>
}
