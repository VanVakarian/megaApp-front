@for (column of columns$$(); track $index) {
  <div class="flex min-w-0 flex-col gap-3 px-1"
       style="grid-row: 1"
       [style.grid-column]="gridColumnsInput()[$index]">
    @for (block of column; track block) {
      @switch (block) {
        @case (Block.Streak) {
          <food-stats-streak />
        }
        @case (Block.TopProducts) {
          <food-stats-top-products />
        }
        @case (Block.Milestones) {
          <food-stats-milestones />
        }
        @case (Block.Charts) {
          <food-stats-charts />
        }
      }
    }
  </div>
}
