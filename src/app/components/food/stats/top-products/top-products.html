<v-card [borderRadius]="2"
        [padding]="2">
  <div class="mb-2 text-base font-semibold">Топ продуктов за 30 дней</div>

  @if (products$$().length === 0) {
    <div class="text-sm text-[color:var(--v-color-text-muted)]">Пока недостаточно данных</div>
  } @else {
    @for (product of products$$(); track product.catalogueId) {
      <div class="mb-2 flex flex-col gap-[3px] last:mb-0">
        <div class="flex justify-between text-xs">
          <span class="font-medium">{{ product.name }}</span>
          <span class="text-[color:var(--v-color-text-muted)]">{{ product.sharePercent }}%</span>
        </div>
        <div class="h-2 rounded-full bg-[color:var(--v-color-surface-accent)]">
          <div class="h-full rounded-full bg-[color:var(--v-color-primary)]"
               [style.width.%]="barWidthPercent(product)"></div>
        </div>
      </div>
    }
  }
</v-card>
