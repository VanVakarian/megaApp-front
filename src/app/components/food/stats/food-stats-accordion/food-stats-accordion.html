<div class="flex flex-wrap gap-2">
  @for (toggle of toggles; track toggle.block) {
    <v-button [surface]="isOpen(toggle.block) ? 'raised' : 'flat'"
              [paddingX]="3"
              (onClick)="toggleBlock(toggle.block)">{{ toggle.label }}</v-button>
  }

  <v-button [surface]="isAllOpen$$() ? 'raised' : 'flat'"
            [paddingX]="3"
            (onClick)="toggleAll()">{{ isAllOpen$$() ? 'Свернуть всё' : 'Развернуть всё' }}</v-button>
</div>

<div class="mt-3 flex flex-col gap-3">
  @if (isOpen(Block.Ribbon)) {
    <food-stats-heatmap-strip />
  }
  @if (isOpen(Block.Streak)) {
    <food-stats-streak />
  }
  @if (isOpen(Block.TopProducts)) {
    <food-stats-top-products />
  }
  @if (isOpen(Block.Milestones)) {
    <food-stats-milestones />
  }
  @if (isOpen(Block.Charts)) {
    <food-stats-charts />
  }
</div>
