<div class="p-2">
  <div class="mx-auto flex max-w-[400px] flex-col gap-2 md:gap-4">

    @if (authService.isAuthenticated$$()) {
      <form [formGroup]="settingsForm">

        <v-card class="flex flex-col text-lg"
                [config]="{
                  padding: 4,
                }">
          <div class="mb-0 font-bold text-right"> Основные настройки </div>
          <div class="mb-4"> Выбор разделов: </div>
          <div class="flex flex-col gap-4 mb-4 ml-5">
            <v-checkbox [config]="{
                          size: 7,
                          checkIconSize: 7,
                          isDisabled: settingsForm.controls.selectedChapterFood.disabled,
                        }"
                        [value]="settingsForm.controls.selectedChapterFood.value"
                        (valueChange)="onSelectedChapterCheckboxChange(KeyOfSettings.selectedChapterFood, $event)">
              Дневник питания
            </v-checkbox>

            <v-checkbox [config]="{
                          size: 7,
                          checkIconSize: 7,
                          isDisabled: settingsForm.controls.selectedChapterMoney.disabled,
                        }"
                        [value]="settingsForm.controls.selectedChapterMoney.value"
                        (valueChange)="onSelectedChapterCheckboxChange(KeyOfSettings.selectedChapterMoney, $event)">
              Дневник финансов
            </v-checkbox>
          </div>

          <v-checkbox [config]="{
                        mode: 'switch',
                        labelPosition: 'left',
                        isDisabled: settingsForm.controls.darkTheme.disabled,
                      }"
                      [value]="settingsForm.controls.darkTheme.value"
                      (valueChange)="onThemeToggleChange($event)">
            Тёмная тема:
          </v-checkbox>
        </v-card>

        <v-card class="flex flex-col mt-4 text-lg"
                [config]="{
                  padding: 4,
                }">
          <div class="font-bold text-right"> Настройки дневника питания </div>

          <div class="w-1/3 mt-4">
            <v-input fieldStateAnimations
                     formControlName="height"
                     class="field-with-progress-animations"
                     [state]="heightFieldState()"
                     [config]="{
                       type: 'text',
                       inputmode: 'numeric',
                       label: 'Рост',
                       fontSize: '20px',
                       fontWeight: 500,
                       textAlign: 'right',
                       errorMessage: isHeightValid ? '' : 'XXX',
                     }"
                     (onInputChanged)="onHeightInput()"
                     (onEnterPressed)="onHeightEnter()">
              <span v-postfix
                    class="ml-1 mr-3 cursor-pointer select-none"
                    (click)="focusHeightInput()"
                    [class.invalid-suffix]="!isHeightValid"> см </span>
            </v-input>
          </div>
        </v-card>
      </form>
    }

    <app-auth-form />

  </div>
</div>

<div class="h-[50vh]"></div>
