<div class="time-screen-shell flex items-stretch justify-center w-full min-w-0 gap-2 p-2">

  <div class="time-settings-column w-96 flex flex-col flex-shrink-0 gap-2">
    <v-card [config]="{
              padding: 2,
              borderRadius: 2,
            }">
      <v-toggle [items]="viewToggleItems"
                [value]="viewToggleValue$$()"
                (valueChange)="onViewChange($event)"></v-toggle>
    </v-card>

    <v-card [config]="{
              padding: 2,
              borderRadius: 2,
            }">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-400">Snap</span>
        <v-toggle [items]="snapToggleItems"
                  [value]="snapToggleValue$$()"
                  (valueChange)="onSnapChange($event)"></v-toggle>
      </div>
    </v-card>

    <v-card [config]="{
              padding: 2,
              borderRadius: 2,
            }">
      <div class="flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="text-sm">Compact mode</span>
          <v-checkbox [config]="{
                        mode: 'switch',
                      }"
                      [value]="timeDisplayPrefsService.compactMode$$()"
                      (valueChange)="onCompactModeChange($event)"></v-checkbox>
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between text-sm">
            <span>Primary height</span>
            <span>{{ timeDisplayPrefsService.primaryHeightPx$$() }}px</span>
          </div>
          <v-slider [value]="timeDisplayPrefsService.primaryHeightPx$$()"
                    [config]="laneHeightSliderConfig"
                    (valueChange)="onPrimaryHeightChange($event)" />
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between text-sm">
            <span>Secondary height</span>
            <span>{{ timeDisplayPrefsService.secondaryHeightPx$$() }}px</span>
          </div>
          <v-slider [value]="timeDisplayPrefsService.secondaryHeightPx$$()"
                    [config]="laneHeightSliderConfig"
                    (valueChange)="onSecondaryHeightChange($event)" />
        </div>
      </div>
    </v-card>

    <activities-list />
    <categories-list />
  </div>

  <div class="time-content-column flex flex-col flex-1 max-w-full min-w-0 gap-2">
    <v-card class="time-entry-card w-full max-w-full min-w-0"
            [config]="{
              padding: 3,
              borderRadius: 2,
            }">
      @if (activeView$$() === TimeScreenView.Entry) {
        <timeline-board [snapMinutesInput]="snapMinutes$$()" />
      } @else {
        <div class="time-stats-placeholder flex items-center justify-center opacity-70 text-center">
          Statistics — coming soon
        </div>
      }
    </v-card>
  </div>

</div>
