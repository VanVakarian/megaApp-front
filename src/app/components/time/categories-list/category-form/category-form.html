<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit category' : 'New category' }}</div>

<div class="flex flex-col gap-4">
  <v-input [config]="{
               label: 'Name',
               placeholder: 'Work',
               type: 'text',
             }"
           [ngModel]="name$$()"
           (ngModelChange)="name$$.set($event)" />

  <v-checkbox [config]="{ mode: 'switch', labelPosition: 'right' }"
              [value]="isArea$$()"
              (valueChange)="isArea$$.set($event)">
    Area category (for main stats)
  </v-checkbox>

  <v-dropdown [label]="'Impact'"
              [placeholder]="'Not set'"
              [items]="impactItems"
              [ngModel]="impact$$()"
              (ngModelChange)="impact$$.set($event)"></v-dropdown>

  <div class="flex flex-col gap-2">
    <span class="opacity-70 text-sm">Color</span>
    <v-color-picker [value]="color$$()"
                    (valueChange)="color$$.set($event)"></v-color-picker>
  </div>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [config]="{ isDisabled: !name$$() }"
              (onClick)="save()">
      {{ isEditing() ? 'Save' : 'Create' }}
    </v-button>

    <v-button class="v-flat"
              (onClick)="cancel()">
      Cancel
    </v-button>
  </div>
</div>
