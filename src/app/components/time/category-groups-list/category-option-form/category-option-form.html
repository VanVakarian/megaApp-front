<div class="mb-4 text-lg font-semibold">{{ isEditing() ? 'Edit option' : 'New option' }}</div>

<div class="flex flex-col gap-4">
  <v-input [config]="{
               label: 'Name',
               placeholder: 'ATS',
               type: 'text',
             }"
           [ngModel]="name$$()"
           (ngModelChange)="name$$.set($event)" />

  @if (isAreaGroup$$()) {
    <div class="flex flex-col gap-2">
      <span class="opacity-70 text-sm">Color</span>
      <v-color-picker [value]="color$$()"
                      (valueChange)="color$$.set($event)"></v-color-picker>
    </div>
  }

  <v-checkbox [config]="{ mode: 'switch', labelPosition: 'right' }"
              [value]="isArchived$$()"
              (valueChange)="isArchived$$.set($event)">
    Archived
  </v-checkbox>

  <div class="flex justify-end gap-2">
    <v-button class="v-primary"
              [config]="{ isDisabled: !name$$() }"
              (onClick)="save()">
      {{ isEditing() ? 'Save' : 'Create' }}
    </v-button>

    <v-button class="v-flat"
              (onClick)="cancel()">
      Cancel
    </v-button>
  </div>
</div>
