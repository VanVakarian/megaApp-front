<v-card class="block"
        [class.cursor-pointer]="isInteractiveInput()"
        [style.width.px]="widthPxInput()"
        [config]="{
          padding: 3,
          borderRadius: 2,
          isSelected: isSelectedInput(),
        }"
        (click)="onCardClick($event)">
  <div class="flex items-center justify-between h-6 gap-2 text-sm">
    @if (isEditModeInput() && !hideDashboardControlsInput()) {
      <div class="flex items-center flex-1 min-w-0 gap-2"
           (click)="$event.stopPropagation()">
        <v-checkbox [value]="isDashboardEnabledInput()"
                    (onChanged)="onDashboardEnabledChange($event)"
                    [config]="{
                      size: 4,
                      checkIconSize: 3,
                      gap: 1,
                      isDisabled: isSelectionDisabledInput(),
                    }" />
        <span class="flex-1 min-w-0 truncate">{{ labelInput() }}</span>
        @if (isDashboardEnabledInput()) {
          <v-input class="shrink-0 w-12"
                   [value]="dashboardOrderInput().toString()"
                   (valueChange)="onDashboardOrderChange($event)"
                   [config]="{
                     type: 'number',
                     inputmode: 'numeric',
                     inputSize: 2,
                     textAlign: 'right',
                     paddingY: '2px',
                     isDisabled: isSelectionDisabledInput(),
                   }" />
        }
      </div>
    } @else {
      <span class="flex items-center min-w-0 gap-1">
        <span class="opacity-70 truncate"
              [attr.title]="technicalNameInput() || null">{{ labelInput() }}</span>
        @if (descriptionInput()) {
          <v-tooltip class="shrink-0"
                     [text]="descriptionInput()">
            <v-icon class="opacity-70"
                    [name]="Icon.Info"
                    [size]="4" />
          </v-tooltip>
        }
      </span>
      <span class="shrink-0 text-base font-semibold">{{ headerDisplayValue$$() }}</span>
    }
  </div>
  <div class="mt-1"
       [style.height.px]="heightPxInput()">
    <canvas #chartCanvas></canvas>
  </div>
</v-card>
