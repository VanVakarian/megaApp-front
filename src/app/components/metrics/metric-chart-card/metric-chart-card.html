<v-card class="block"
        [class.cursor-pointer]="isInteractiveInput()"
        [isSelected]="isSelectedInput()"
        [borderRadius]="2"
        [padding]="2"
        [style.padding-bottom]="'5px'"
        (click)="onCardClick()">
  <div class="min-h-6 flex items-start justify-between gap-2 text-xs">
    @if (isEditModeInput() && !hideDashboardControlsInput()) {
      <div class="flex items-center flex-1 min-w-0 gap-2"
           (click)="$event.stopPropagation()">
        <v-checkbox [value]="isDashboardEnabledInput()"
                    (onChanged)="onDashboardEnabledChange($event)"
                    [isDisabled]="isSelectionDisabledInput()"
                    [size]="4"
                    [gap]="1"
                    [checkIconSize]="3" />
        <span class="flex-1 min-w-0 truncate">{{ labelInput() }}</span>
        @if (isDashboardEnabledInput()) {
          <v-input class="shrink-0 w-12"
                   [value]="dashboardOrderInput().toString()"
                   (valueChange)="onDashboardOrderChange($event)"
                   type="number"
                   inputmode="numeric"
                   [isDisabled]="isSelectionDisabledInput()"
                   [inputSize]="2"
                   paddingY="2px"
                   textAlign="right" />
        }
      </div>
    } @else {
      <v-tooltip [text]="labelTooltipText$$()">
        <span class="opacity-70 min-w-0 leading-none truncate">{{ labelInput() }}</span>
      </v-tooltip>
      <span class="shrink-0 flex flex-col items-end">
        <span class="text-sm font-semibold leading-none">{{ headerDisplayValue$$() }}</span>
        @if (headerMinMaxDisplay$$(); as minMax) {
          <span class="opacity-60 text-xs leading-none">{{ minMax }}</span>
        }
      </span>
    }
  </div>
  <div class="mt-0"
       [style.height.px]="heightPxInput()">
    <canvas #chartCanvas></canvas>
  </div>
</v-card>
