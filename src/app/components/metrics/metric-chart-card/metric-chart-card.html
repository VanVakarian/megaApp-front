<v-card class="block w-64"
        [config]="{
          padding: 3,
          borderRadius: 2,
        }">
  <div class="opacity-70 flex items-center justify-between gap-2 text-sm">
    <span class="truncate">{{ labelInput() }}</span>
    <span class="shrink-0 text-base font-semibold opacity-100">{{ valueInput() }}</span>
  </div>
  <div class="h-28 mt-1">
    <canvas #chartCanvas></canvas>
  </div>
</v-card>
