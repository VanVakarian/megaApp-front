@for (item of renderItems$$(); track trackRenderItem(item)) {
  @let display = item.isExpanded ? item.card.expandedDisplay : item.card.display;
  <metric-chart-card [labelInput]="item.card.label"
                     [technicalNameInput]="item.card.technicalName"
                     [valueInput]="item.card.value"
                     [displayValueInput]="item.card.displayValue"
                     [colorInput]="item.card.color"
                     [unitInput]="item.card.unit"
                     [granularityInput]="item.card.granularity"
                     [seriesInput]="display.series"
                     [chartModeInput]="item.card.chartMode"
                     [windowStartInput]="display.windowStartBucket"
                     [windowEndInput]="display.windowEndBucket"
                     [displayStepSecondsInput]="display.displayStepSeconds"
                     [syncCrosshairEnabledInput]="syncCrosshairEnabledInput()"
                     [forceZeroBaselineInput]="forceZeroBaselineInput()"
                     [tooltipModeInput]="tooltipModeInput()"
                     [descriptionInput]="item.card.description"
                     [widthPxInput]="item.isExpanded ? expandedWidthPxInput() : cardWidthPxInput()"
                     [heightPxInput]="item.isExpanded ? expandedHeightPxInput() : cardHeightPxInput()"
                     [isSelectedInput]="item.card.key === selectedKey$$()"
                     [isInteractiveInput]="canExpand$$()"
                     [isEditModeInput]="isEditModeInput()"
                     [hideDashboardControlsInput]="hideDashboardControlsInput()"
                     [isDashboardEnabledInput]="item.card.isDashboardEnabled"
                     [dashboardOrderInput]="item.card.dashboardOrder"
                     [isSelectionDisabledInput]="isSelectionDisabledInput()"
                     (cardClickOutput)="onCardToggle(item.card.key)"
                     (dashboardEnabledChangeOutput)="onCardDashboardEnabledChange(item.card.technicalName, $event)"
                     (dashboardOrderChangeOutput)="onCardDashboardOrderChange(item.card.technicalName, $event)" />
}
