<v-modal [config]="{
           isOpen: isModalOpen(),
           borderRadius: 3,
           padding: 4,
           deviceType: deviceInfoService.isMobileScreen$$() ? 'mobile' : 'desktop',
           mobileWidth: 'min(100vw, 300px)',
           desktopWidth: '300px',
         }"
         (onClose)="onClose()">
  <div class="flex flex-col gap-4">
    @if (modalTitle()) {
      <div class="text-xl font-medium text-center">
        {{ modalTitle() }}
      </div>
    }

    @if (modalMessage()) {
      <div class="opacity-70 text-sm text-center">
        {{ modalMessage() }}
      </div>
    }

    <div class="flex gap-4">
      <v-button class="v-flat"
                [config]="{
                  width: '100%'
                }"
                (onClick)="onCancel()">
        {{ cancelButtonLabel() }}
      </v-button>

      <v-button class="v-danger"
                [config]="{
                  width: '100%'
                }"
                (onClick)="onConfirm()">
        {{ confirmButtonLabel() }}
      </v-button>
    </div>
  </div>
</v-modal>
