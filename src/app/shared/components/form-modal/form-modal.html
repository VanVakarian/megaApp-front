<v-modal [config]="{
           isOpen: isModalOpen(),
           borderRadius: 3,
           padding: 4,
           isCloseButtonVisible: false,
           deviceType: deviceInfoService.isMobileScreen$$() ? 'mobile' : 'desktop',
           mobileWidth: 'min(100vw, 520px)',
           desktopWidth: '520px',
         }"
         (onClose)="onClose()">
  <ng-content />
</v-modal>
