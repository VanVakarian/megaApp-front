<button [type]="type()"
        [disabled]="isDisabled()"
        (click)="onButtonClick($event)">

  <ng-content select="[v-prefix]"
              class="prefix" />

  @if (!isLabelHidden()) {
    <div class="btn-text">
      <ng-content />
    </div>
  }

  <ng-content select="[v-postfix]"
              class="postfix" />

</button>
